<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כנסת ישראל - שביל הים</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      color: #333;
      text-align: center;
    }
    header {
      background-color: #1a365d;
      color: white;
      padding: 20px 10px;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .img-container img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .donate-btn {
      display: inline-block;
      background-color: #2b6cb0;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 12px 30px;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
      margin-top: 15px;
    }
    .donate-btn:hover {
      background-color: #2c5282;
    }
  </style>
</head>
<body>

  <header>
    <h1>ספינת המעפילים "כנסת ישראל"</h1>
  </header>

  <div class="container">
    <!-- נתיב לתמונה KNSETISRAEL.jpg שנמצאת בשורש (Root) -->
    <div class="img-container">
      <img src="../KNESETISRAEL.jpg" alt="כנסת ישראל">
    </div>

    <h2>שותפים להנצחת שביל הים</h2>
    <p>אנו מזמינים אתכם לקחת חלק בפרויקט הנצחת מורשת המעפילים בשביל הים.</p>

    <!-- קישור תרומה ל-GROW -->
    <a href="https://www.grow.il/" target="_blank" rel="noopener noreferrer" class="donate-btn">
      לתרומה מאובטחת דרך GROW
    </a>
  </div>

</body>
</html>
